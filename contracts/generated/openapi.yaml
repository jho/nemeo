openapi: 3.0.0
info:
  title: Nemeo API
  version: 0.0.0
tags: []
paths:
  /health:
    get:
      operationId: health
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/google/callback:
    get:
      operationId: IAM_completeGoogleAuthentication
      description: |-
        EM mapping:
        - Model: iam
        - Boundary: Google OIDC callback
        - Translations: Google OIDC Callback — New Identity or Google OIDC Callback — Existing Identity
        - Commands: IAM.Commands.signUp or IAM.Commands.authenticate
        - Results: IAM.UserAccountCreated or IAM.UserAuthenticated
      parameters:
        - $ref: "#/components/parameters/IAM.GoogleAuthCallbackQuery.code"
        - $ref: "#/components/parameters/IAM.GoogleAuthCallbackQuery.state"
        - $ref: "#/components/parameters/IAM.GoogleAuthCallbackQuery.error"
      responses:
        "302":
          description: Redirection
          headers:
            Location:
              required: true
              schema:
                type: string
  /v1/auth/google/start:
    get:
      operationId: IAM_startGoogleAuthentication
      description: |-
        EM mapping:
        - Model: iam
        - Boundary: Google OIDC callback
        - Translation: Google OIDC Callback — New Identity
        - Command: IAM.Commands.signUp
        - Result: IAM.UserAccountCreated
      parameters: []
      responses:
        "302":
          description: Redirection
          headers:
            Location:
              required: true
              schema:
                type: string
  /v1/households:
    get:
      operationId: IAM_listHouseholds
      description: |-
        EM mapping:
        - Model: iam
        - Slice: view-current-household
        - View: IAM.Views.getCurrentHousehold / IAM.CurrentHousehold
        - Auth: authenticated principal
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAM.HouseholdCollectionResponse"
    post:
      operationId: IAM_createInitialHousehold
      description: |-
        EM mapping:
        - Model: iam
        - Slice: create-initial-household
        - Command: IAM.Commands.createInitialHousehold
        - Input projection: userId comes from the authenticated session; name comes from the request
        - Result: IAM.HouseholdCreated and IAM.CurrentHousehold
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAM.CurrentHousehold"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IAM.CreateInitialHouseholdRequest"
  /v1/users/me:
    get:
      operationId: IAM_getCurrentUser
      description: |-
        EM mapping:
        - Model: iam
        - Slice: view-current-user
        - View: IAM.Views.getCurrentUser / IAM.CurrentUser
        - Auth: authenticated principal
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAM.CurrentUser"
components:
  parameters:
    IAM.GoogleAuthCallbackQuery.code:
      name: code
      in: query
      required: true
      schema:
        type: string
      explode: false
    IAM.GoogleAuthCallbackQuery.error:
      name: error
      in: query
      required: false
      schema:
        type: string
      explode: false
    IAM.GoogleAuthCallbackQuery.state:
      name: state
      in: query
      required: true
      schema:
        type: string
      explode: false
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    IAM.CreateInitialHouseholdRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    IAM.CurrentHousehold:
      type: object
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
      description: Consumers tolerate unknown fields; additive changes do not break them.
    IAM.CurrentUser:
      type: object
      required:
        - id
        - provider
        - verifiedEmail
        - displayName
      properties:
        id:
          type: string
        provider:
          type: string
        verifiedEmail:
          type: string
        displayName:
          type: string
      description: Consumers tolerate unknown fields; additive changes do not break them.
    IAM.HouseholdCollectionResponse:
      type: object
      required:
        - data
        - hasMore
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IAM.CurrentHousehold"
        hasMore:
          type: boolean
        nextCursor:
          type: string
servers:
  - url: http://localhost:3000
    description: Local development
    variables: {}
