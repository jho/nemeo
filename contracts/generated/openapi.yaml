openapi: 3.0.0
info:
  title: Nemeo API
  version: 0.0.0
tags: []
paths:
  /health:
    get:
      operationId: health
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/google/callback:
    get:
      operationId: completeGoogleAuthentication
      parameters:
        - $ref: "#/components/parameters/GoogleAuthCallbackQuery.code"
        - $ref: "#/components/parameters/GoogleAuthCallbackQuery.state"
        - $ref: "#/components/parameters/GoogleAuthCallbackQuery.error"
      responses:
        "302":
          description: Redirection
          headers:
            Location:
              required: true
              schema:
                type: string
  /v1/auth/google/start:
    get:
      operationId: startGoogleAuthentication
      parameters: []
      responses:
        "302":
          description: Redirection
          headers:
            Location:
              required: true
              schema:
                type: string
  /v1/household-setup:
    get:
      operationId: getHouseholdSetupStatus
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdSetupStatusResponse"
  /v1/households:
    post:
      operationId: createInitialHousehold
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInitialHouseholdRequest"
components:
  parameters:
    GoogleAuthCallbackQuery.code:
      name: code
      in: query
      required: true
      schema:
        type: string
      explode: false
    GoogleAuthCallbackQuery.error:
      name: error
      in: query
      required: false
      schema:
        type: string
      explode: false
    GoogleAuthCallbackQuery.state:
      name: state
      in: query
      required: true
      schema:
        type: string
      explode: false
  schemas:
    CreateInitialHouseholdRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    HouseholdResponse:
      type: object
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - manager
    HouseholdSetupStatusResponse:
      type: object
      required:
        - canCreateInitialHousehold
      properties:
        canCreateInitialHousehold:
          type: boolean
        householdId:
          type: string
servers:
  - url: http://localhost:3000
    description: Local development
    variables: {}
