repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [markdown]
      - id: end-of-file-fixer
        types: [markdown]
      - id: check-merge-conflict
        types: [markdown]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        types: [markdown]

  - repo: local
    hooks:
      - id: event-model-validation
        name: validate event model system
        entry: npx --yes @milehimikey/em@1.14.0 system docs/event-model/system.yaml
        language: system
        pass_filenames: false
        files: ^docs/event-model/(system\.yaml|models/.*\.em)$
      - id: event-model-render
        name: render event model diagrams
        entry: bash scripts/render-event-models.sh
        language: system
        pass_filenames: false
        files: ^docs/event-model/(system\.yaml|models/.*\.(em|svg))$
