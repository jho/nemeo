<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nemeo — Authentication</title>
  <style>
    :root {
      --ink: #20243a;
      --muted: #74778b;
      --paper: #f7f7fb;
      --surface: #ffffff;
      --line: #e1e3ee;
      --blue: #5b65ae;
      --blue-soft: #eceeff;
      --green: #347b68;
      --green-soft: #e4f3ee;
      --coral: #bd594b;
      --coral-soft: #fbe7e3;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button { font: inherit; cursor: pointer; }
    .shell { min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; }
    .panel { width: min(100%, 440px); padding: clamp(28px, 7vw, 52px); background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 22px 60px rgba(24, 33, 43, .09); text-align: center; }
    .bot { width: 52px; height: 52px; margin: 0 auto 24px; border-radius: 16px; background: #e0e3ff; position: relative; box-shadow: 0 0 0 6px rgba(146, 153, 235, .12); }
    .bot::before, .bot::after { content: ""; position: absolute; top: 20px; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
    .bot::before { left: 13px; } .bot::after { right: 13px; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(30px, 8vw, 42px); line-height: 1.04; letter-spacing: -.055em; }
    .lede { margin: 0 auto; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .provider { width: 100%; display: flex; align-items: center; justify-content: center; gap: 11px; margin-top: 30px; padding: 13px 16px; border: 1px solid #c9ccda; border-radius: 11px; background: white; color: var(--ink); font-weight: 800; }
    .provider:hover, .provider:focus-visible { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(91, 101, 174, .15); outline: none; }
    .google-mark { display: grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; color: #4285f4; font-size: 17px; font-weight: 900; }
    .fine-print { margin: 22px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .status { min-height: 22px; margin-top: 18px; color: var(--muted); font-size: 13px; }
    .status[data-kind="error"] { color: var(--coral); }
    .status[data-kind="success"] { color: var(--green); }
    .notice { display: none; margin-top: 20px; padding: 13px 15px; border-radius: 12px; background: var(--coral-soft); color: var(--coral); font-size: 13px; line-height: 1.45; text-align: left; }
    .notice[data-visible="true"] { display: block; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="page-title">
      <div class="bot" aria-hidden="true"></div>
      <div class="eyebrow">Welcome to Nemeo</div>
      <h1 id="page-title">Keep your budget on pace</h1>
      <p class="lede">Sign in securely to get a clear view of your spending without another password to remember.</p>
      <button id="google-button" class="provider" type="button">
        <span class="google-mark" aria-hidden="true">G</span>
        <span>Continue with Google</span>
      </button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="notice" class="notice" data-visible="false" role="alert">Google sign-in was cancelled or could not be completed. Try again when you’re ready.</div>
      <p class="fine-print">Nemeo does not create or manage a separate password.</p>
    </section>
  </main>
  <script>
    const button = document.querySelector('#google-button');
    const status = document.querySelector('#status');
    const notice = document.querySelector('#notice');

    button.addEventListener('click', () => {
      button.disabled = true;
      button.querySelector('span:last-child').textContent = 'Connecting to Google…';
      status.textContent = 'Checking your Nemeo account…';
      notice.dataset.visible = 'false';
      window.setTimeout(() => {
        button.disabled = false;
        button.querySelector('span:last-child').textContent = 'Continue with Google';
        status.textContent = 'Prototype: the provider callback resolves sign-up or authentication.';
        status.dataset.kind = 'success';
      }, 650);
    });
  </script>
</body>
</html>
