<svg width="251pt" height="441pt"
 viewBox="0.00 0.00 251.00 441" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="em-arrow-3C4043" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#3C4043"/></marker><marker id="em-arrow-2B6CB0" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#2B6CB0"/></marker></defs><metadata id="em-slices">{"slices":[{"index":0,"name":"Create Initial Household","x0":97.87,"x1":241.87,"docHtml":"&lt;h1&gt;Slice: Create Initial Household&lt;/h1&gt;\n&lt;p&gt;&lt;img src=\"create-initial-household.svg\" alt=\"Diagram\"&gt;&lt;/p&gt;\n&lt;h2&gt;Intent&lt;/h2&gt;\n&lt;p&gt;Create the new user’s first household with a user-provided name. The authenticated user becomes the\nhousehold’s root manager, and subsequent budget setup is owned by that household.&lt;/p&gt;\n&lt;h2&gt;Application API contract&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;POST /v1/households&lt;/code&gt; accepts &lt;code&gt;{ &amp;quot;name&amp;quot;: string }&lt;/code&gt; for the authenticated user.&lt;/li&gt;\n&lt;li&gt;The application derives the root manager from the session; the client cannot provide an owner or\nhousehold ID.&lt;/li&gt;\n&lt;li&gt;A successful response returns the created household and manager role. Duplicate initial creation\nis rejected or resolved to the existing household according to the command invariants.&lt;/li&gt;\n&lt;li&gt;The route maps to &lt;code&gt;Create Initial Household&lt;/code&gt;; &lt;code&gt;Household Created&lt;/code&gt; is the durable domain result.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Domain behavior&lt;/h2&gt;\n&lt;h3&gt;Command&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;Create Initial Household&lt;/code&gt; accepts the authenticated principal and a non-empty household name.\nIdentity and household authorization are resolved at the application boundary; the command does not\naccept an arbitrary owner or household scope from the client.&lt;/p&gt;\n&lt;h3&gt;Event&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;Household Created&lt;/code&gt; records the household identity, display name, and root-manager ownership.&lt;/p&gt;\n&lt;h2&gt;Scenarios&lt;/h2&gt;\n&lt;h3&gt;Create the initial household&lt;/h3&gt;\n&lt;p&gt;Given an authenticated user with no household\nWhen the user submits a valid household name\nThen Nemeo creates one household owned by that user\nAnd the user is assigned the root manager role\nAnd Nemeo records &lt;code&gt;Household Created&lt;/code&gt;&lt;/p&gt;\n&lt;h3&gt;Household name is required&lt;/h3&gt;\n&lt;p&gt;Given an authenticated user with no household\nWhen the user submits an empty or invalid household name\nThen the household is not created\nAnd the user receives a validation error&lt;/p&gt;\n&lt;h3&gt;User already belongs to a household&lt;/h3&gt;\n&lt;p&gt;Given an authenticated user who already belongs to a household\nWhen the user submits initial household setup\nThen Nemeo does not create a second household\nAnd the user is directed to the existing household&lt;/p&gt;\n&lt;h3&gt;Unauthenticated setup attempt&lt;/h3&gt;\n&lt;p&gt;Given a request without a valid authenticated principal\nWhen the request attempts to create an initial household\nThen Nemeo rejects the command\nAnd no household is created&lt;/p&gt;\n&lt;h2&gt;Invariants&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;A user belongs to exactly one household in MVP.&lt;/li&gt;\n&lt;li&gt;The initial household has exactly one root manager lifecycle owner.&lt;/li&gt;\n&lt;li&gt;The household name is present and valid before &lt;code&gt;Household Created&lt;/code&gt; is recorded.&lt;/li&gt;\n&lt;li&gt;The client cannot choose another user as the root manager.&lt;/li&gt;\n&lt;li&gt;Repeating the command cannot create a second household for the same user.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Open questions&lt;/h2&gt;\n&lt;p&gt;None for the MVP slice.&lt;/p&gt;\n&lt;h2&gt;Verification notes&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Cover successful creation, invalid names, duplicate submission, an existing household, and an\nunauthenticated request with PostgreSQL-backed integration tests at the application boundary.&lt;/li&gt;\n&lt;li&gt;Verify that the created household is immediately available to the next budget-setup slice and that\nthe root-manager authorization is resolved consistently for HTTP, MCP, worker, and scheduled paths.&lt;/li&gt;\n&lt;/ul&gt;\n"}],"rowLabels":{"x0":-8.130000000000003,"x1":89.87}}</metadata><style>.em-slice-dim{opacity:.15;transition:opacity .15s ease}</style>
