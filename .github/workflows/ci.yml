name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation and event model
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Validate event model system
        run: npm exec --yes --package @milehimikey/em@1.14.0 -- em system docs/event-model/system.yaml

      - name: Render context diagrams
        run: bash scripts/render-event-models.sh

      - name: Check rendered diagrams are current
        run: |
          git diff --exit-code -- docs/event-model/models
          test -z "$(git ls-files --others --exclude-standard -- docs/event-model/models)"

      - name: Check whitespace in the full diff
        run: git diff --check

  quality:
    name: Quality and pure tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks and pure tests
        run: npm run validate

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: nemeo
      POSTGRES_USER: nemeo
      POSTGRES_PASSWORD: ci-only-password
      TEST_POSTGRES_PORT: 55432
      DATABASE_URL: postgresql://nemeo:ci-only-password@127.0.0.1:55432/nemeo
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start clean PostgreSQL
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d db

      - name: Wait for PostgreSQL
        run: timeout 60 sh -c 'until docker compose -f compose.yaml -f compose.ci.yaml exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done'

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run integration tests
        run: npm run test:integration

      - name: Tear down PostgreSQL
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v

  e2e:
    name: Critical-path E2E harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run critical-path E2E harness
        run: npm run test:e2e
