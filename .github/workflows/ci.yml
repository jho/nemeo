name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation and event model
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Render event model
        run: npx --yes @milehimikey/em@1.8.1 render budgeting.em -o budgeting.svg

      - name: Normalize renderer metadata
        run: sed -i -E 's/Generated by graphviz version [^ ]+ \(0\)/Generated by graphviz version normalized (0)/' budgeting.svg

      - name: Check rendered event model is committed
        run: git diff --exit-code -- budgeting.svg

      - name: Check whitespace in the full diff
        run: git diff --check
